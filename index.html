<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário Turbo IA</title>
    <!-- Tailwind CSS para um design moderno e responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-2xl w-full bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700">
        
        <!-- Cabeçalho -->
        <div class="text-center mb-6">
            <span class="text-4xl">🚀</span>
            <h1 class="text-2xl font-bold mt-2">Calendário Turbo IA</h1>
            <p class="text-slate-400 text-sm mt-1">Gerador Inteligente de Conteúdos com Inteligência Artificial</p>
        </div>

        <!-- Formulário -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Chave da API do Gemini (Google AI)</label>
                <input 
                    type="password" 
                    id="apiKey" 
                    placeholder="Cole sua chave API do Gemini aqui..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-blue-500 text-slate-100"
                >
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Qual é o seu nicho?</label>
                <input 
                    type="text" 
                    id="nicho" 
                    placeholder="Ex: Mecânico, Nutricionista, Imobiliária..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-blue-500 text-slate-100"
                >
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Produto ou Serviço em Foco</label>
                <input 
                    type="text" 
                    id="produto" 
                    placeholder="Ex: Suspensão, Consultoria online, Minha Casa Minha Vida..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-blue-500 text-slate-100"
                >
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Objetivo da Campanha</label>
                <select 
                    id="objetivo" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-blue-500 text-slate-100"
                >
                    <option value="Viralizar (Topo de Funil)">🚀 Viralizar (Topo de Funil)</option>
                    <option value="Gerar Autoridade e Confiança">🎯 Gerar Autoridade e Confiança</option>
                    <option value="Vender Produto / Agendar Serviço">💰 Vender Produto / Serviço</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Tom de Voz</label>
                <select 
                    id="tom" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-blue-500 text-slate-100"
                >
                    <option value="Descontraído e Persuasivo">Descontraído e Persuasivo</option>
                    <option value="Profissional e Direto">Profissional e Direto</option>
                    <option value="Acolhedor e Educativo">Acolhedor e Educativo</option>
                </select>
            </div>

            <button 
                onclick="gerarCalendario()" 
                id="btnGerar"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-lg cursor-pointer"
            >
                Gerar Meu Planeamento Estratégico
            </button>
        </div>

        <!-- Área de Resultados -->
        <div id="resultadoContainer" class="mt-8 space-y-6 hidden">
            <h2 class="text-xl font-bold text-blue-400 border-b border-slate-700 pb-2">Seu Planeamento de 7 Dias Pronto:</h2>
            <div id="listaCalendario" class="space-y-4"></div>
        </div>

    </div>

    <!-- Script de Integração Direta com o Gemini (Modelo Atualizado) -->
    <script>
        async function gerarCalendario() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const nicho = document.getElementById('nicho').value.trim();
            const produto = document.getElementById('produto').value.trim();
            const objetivo = document.getElementById('objetivo').value;
            const tom = document.getElementById('tom').value;
            const btn = document.getElementById('btnGerar');
            const container = document.getElementById('resultadoContainer');
            const lista = document.getElementById('listaCalendario');

            if (!apiKey) {
                alert("Por favor, insira a sua chave da API do Gemini.");
                return;
            }

            if (!nicho || !produto) {
                alert("Por favor, preencha o nicho e o produto/serviço.");
                return;
            }

            btn.disabled = true;
            btn.textContent = "A Inteligência Artificial está a criar o seu calendário...";
            container.classList.remove('hidden');
            lista.innerHTML = `<div class="text-center text-slate-400 py-4">A processar dados com a IA... Aguarde um instante.</div>`;

            const prompt = `Você é um copywriter de elite e estrategista de marketing digital especialista em conversão para redes sociais.
Crie um calendário estratégico de 7 dias de conteúdo altamente focado e magnético com base nestes dados:
- Nicho de mercado: ${nicho}
- Produto ou Serviço em foco: ${produto}
- Objetivo principal da campanha: ${objetivo}
- Tom de voz desejado: ${tom}

REGRAS OBRIGATÓRIAS:
1. Escreva tudo em Português do Brasil de forma extremamente natural, comercial e atrativa.
2. Adapte totalmente o conteúdo ao produto/serviço específico de forma criativa e personalizada.
3. Retorne APENAS um JSON puro e válido, sem blocos markdown (sem \`\`\`json), contendo uma única chave chamada "calendario" que seja um array com exatamente 7 objetos (um para cada dia).

Estrutura de cada objeto no array:
- dia (número de 1 a 7)
- formato (string: ex: "Reels", "Carrossel", "Post Estático")
- titulo (string com o tema central do dia)
- visual (string com a sugestão exata de cena ou design para o post)
- roteiro (string com o gancho magnético e desenvolvimento do conteúdo)
- legenda (string pronta para copiar e colar, com copy persuasiva e hashtags no final)`;

            try {
                // Utilizando o modelo oficial gemini-1.5-flash suportado
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || "Erro ao comunicar com a API do Gemini.");
                }

                const textoGerado = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
                const textoLimpo = textoGerado.replace(/```json/g, '').replace(/```/g, '').trim();

                const resultadoJson = JSON.parse(textoLimpo);
                const calendarioArray = resultadoJson.calendario || resultadoJson;

                let htmlConteudo = '';
                calendarioArray.forEach(item => {
                    htmlConteudo += `
                        <div class="bg-slate-900 border border-slate-700 rounded-xl p-4 space-y-2">
                            <div class="flex justify-between items-center">
                                <span class="bg-blue-600 text-white text-xs font-bold px-2.5 py-1 rounded-md">Dia ${item.dia}</span>
                                <span class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-md border border-slate-700 font-semibold">${item.formato}</span>
                            </div>
                            <p class="font-semibold text-sm text-slate-200">${item.titulo}</p>
                            <div class="bg-slate-800/60 p-3 rounded-lg text-xs text-slate-300 space-y-1">
                                <p><strong class="text-blue-300">Sugestão Visual:</strong> ${item.visual}</p>
                                <p><strong class="text-green-300">Roteiro / Gancho:</strong> ${item.roteiro}</p>
                            </div>
                            <div class="text-xs text-slate-400 bg-slate-950 p-3 rounded-lg whitespace-pre-wrap font-mono">
                                ${item.legenda}
                            </div>
                        </div>
                    `;
                });

                lista.innerHTML = htmlConteudo;

            } catch (error) {
                console.error(error);
                lista.innerHTML = `<div class="bg-red-900/40 border border-red-700 text-red-300 p-3 rounded-lg text-sm">Erro ao gerar conteúdo: ${error.message}</div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = "Gerar Meu Planeamento Estratégico";
            }
        }
    </script>
</body>
</html>
