<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário Turbo IA</title>
    <!-- Tailwind CSS para um design moderno e responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-2xl w-full bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700">
        
        <!-- Cabeçalho -->
        <div class="text-center mb-6">
            <span class="text-4xl">🚀</span>
            <h1 class="text-2xl font-bold mt-2">Calendário Turbo IA</h1>
            <p class="text-slate-400 text-sm mt-1">Gerador Inteligente de Conteúdos por Nicho (100% Estável)</p>
        </div>

        <!-- Formulário -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Qual é o seu nicho?</label>
                <input 
                    type="text" 
                    id="nicho" 
                    placeholder="Ex: Nutricionista, Psicóloga, Supermercado, Imóveis..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-blue-500 text-slate-100"
                >
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Produto ou Serviço em Foco</label>
                <input 
                    type="text" 
                    id="produto" 
                    placeholder="Ex: Consulta de Rotina, Terapia de Casal, Hortifrúti, Minha Casa Minha Vida..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-blue-500 text-slate-100"
                >
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Objetivo da Campanha</label>
                <select 
                    id="objetivo" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-blue-500 text-slate-100"
                >
                    <option value="Atrair Novos Clientes (Topo de Funil)">🚀 Atrair Novos Seguidores e Clientes</option>
                    <option value="Gerar Autoridade e Confiança">🎯 Gerar Autoridade e Confiança</option>
                    <option value="Vender Produto / Agendar Consulta">💰 Vender ou Agendar Atendimento</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Tom de Voz</label>
                <select 
                    id="tom" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-blue-500 text-slate-100"
                >
                    <option value="Acolhedor e Educativo">Acolhedor e Educativo</option>
                    <option value="Profissional e Direto">Profissional e Direto</option>
                    <option value="Inspirador e Prático">Inspirador e Prático</option>
                </select>
            </div>

            <button 
                onclick="gerarCalendario()" 
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-lg cursor-pointer"
            >
                Gerar Meu Planeamento Estratégico
            </button>
        </div>

        <!-- Área de Resultados -->
        <div id="resultadoContainer" class="mt-8 space-y-6 hidden">
            <h2 class="text-xl font-bold text-blue-400 border-b border-slate-700 pb-2">Seu Planeamento de 7 Dias Pronto:</h2>
            <div id="listaCalendario" class="space-y-4"></div>
        </div>

    </div>

    <!-- Script da Mini IA Contextual -->
    <script>
        function gerarCalendario() {
            const nichoInput = document.getElementById('nicho').value.trim();
            const produtoInput = document.getElementById('produto').value.trim();
            const objetivo = document.getElementById('objetivo').value;
            const tom = document.getElementById('tom').value;
            const container = document.getElementById('resultadoContainer');
            const lista = document.getElementById('listaCalendario');

            if (!nichoInput || !produtoInput) {
                alert("Por favor, preencha o nicho e o produto/serviço.");
                return;
            }

            lista.innerHTML = "";
            container.classList.remove('hidden');

            const nLower = nichoInput.toLowerCase();
            let isSaude = nLower.includes('nutri') || nLower.includes('psicó') || nLower.includes('psico') || nLower.includes('médic') || nLower.includes('terapeut') || nLower.includes('saúde');
            let isComercio = nLower.includes('supermercado') || nLower.includes('loja') || nLower.includes('roupa') || nLower.includes('comércio');

            let diasGerados = [];
            const formatos = ['Reels', 'Carrossel Educativo', 'Post Estático', 'Reels', 'Carrossel de Dicas', 'Bastidores', 'Reels'];

            for (let i = 1; i <= 7; i++) {
                let gancho = "";
                let desenvolvimento = "";
                let visual = "";
                let cta = "";

                if (isSaude) {
                    // Contexto ético para saúde e bem-estar (Sem termos de comércio agressivo ou antes/depois)
                    const ganchosSaude = [
                        `Você já parou para pensar em como ${produtoInput} pode transformar a sua rotina de forma leve?`,
                        `O maior mito que vejo sobre ${nichoInput} é achar que para cuidar da saúde é preciso sofrer.`,
                        `Três sinais claros de que está na hora de dar mais atenção para ${produtoInput} na sua vida.`,
                        `Muita gente me pergunta no consultório como começar a lidar melhor com os desafios de ${nichoInput}.`,
                        `O que a ciência e a prática diária nos dizem sobre os benefícios de ${produtoInput}?`
                    ];
                    const descSaude = [
                        `Muitas vezes focamos no problema e esquecemos que o processo precisa ser sustentável a longo prazo. Pequenas mudanças consistentes geram um impacto profundo no seu dia a dia.`,
                        `O autoconhecimento e o cuidado estruturado com ${produtoInput} ajudam a criar bases sólidas para a sua qualidade de vida, sem cobranças excessivas.`,
                        `A nossa jornada é única. Entender os seus limites e respeitar o seu tempo é o primeiro passo para evoluir com segurança e bem-estar.`
                    ];
                    gancho = ganchosSaude[(i + nichoInput.length) % ganchosSaude.length];
                    desenvolvimento = descSaude[i % descSaude.length];
                    visual = i % 2 === 0 ? "Carrossel com texto limpo, fundo neutro e orientações práticas passo a passo." : "Vídeo estilo Reels falando diretamente para a câmara, com tom calmo e acolhedor.";
                    cta = "Deixe nos comentários a sua dúvida ou envie uma mensagem direta para conversarmos com total sigilo.";
                } else if (isComercio) {
                    // Contexto para comércio / varejo
                    const ganchosComercio = [
                        `Procurando por qualidade e economia real em ${produtoInput}? Olha o que preparamos para você!`,
                        `Quem é cliente de ${nichoInput} sabe: economizar tempo e dinheiro faz toda a diferença na semana.`,
                        `O produto mais pedido da semana em ${nichoInput} acabou de chegar com condições imperdíveis.`,
                        `Dica de ouro para quem quer aproveitar o melhor de ${produtoInput} sem complicação.`
                    ];
                    const descComercio = [
                        `Selecionamos rigorosamente as melhores opções para garantir que você leve para casa apenas o melhor padrão de qualidade com um preço que cabe no bolso.`,
                        `Venha conferir de perto as nossas novidades e aproveite para garantir tudo o que você precisa num só lugar.`
                    ];
                    gancho = ganchosComercio[(i + nichoInput.length) % ganchosComercio.length];
                    desenvolvimento = descComercio[i % descComercio.length];
                    visual = "Carrossel dinâmico destacando fotos reais dos produtos, preços ou facilidades.";
                    cta = "Clica no link da bio ou manda 'EU QUERO' no direct para garantir o seu!";
                } else {
                    // Contexto geral para prestadores de serviço, imobiliárias, infoprodutos, etc.
                    const ganchosGeral = [
                        `O erro mais comum de quem busca resultados rápidos em ${nichoInput} é ignorar este detalhe essencial.`,
                        `Como transformar a sua experiência com ${produtoInput} de forma simples e eficiente.`,
                        `Tudo o que você queria saber sobre ${nichoInput} explicado de maneira direta e sem enrolação.`,
                        `Por que investir em ${produtoInput} vai mudar a forma como você resolve este problema hoje.`
                    ];
                    const descGeral = [
                        `Quando alinhamos a estratégia correta com uma execução profissional, os resultados aparecem com consistência e segurança.`,
                        `O mercado exige soluções práticas. É exatamente isso que entregamos através de ${produtoInput} para o nosso público.`
                    ];
                    gancho = ganchosGeral[(i + nichoInput.length) % ganchosGeral.length];
                    desenvolvimento = descGeral[i % descGeral.length];
                    visual = "Vídeo dinâmico de apresentação ou carrossel com os pontos principais em destaque.";
                    cta = "Clica no link da bio para saber mais detalhes e começar hoje mesmo.";
                }

                diasGerados.push({
                    dia: i,
                    formato: formatos[i - 1],
                    titulo: `Dia ${i}: Conteúdo Estratégico (${objetivo})`,
                    visual: visual,
                    roteiro: `${gancho} ${desenvolvimento}`,
                    legenda: `💡 Dica especial sobre ${produtoInput} para quem acompanha o nosso perfil em ${nichoInput}.\n\n${desenvolvimento}\n\n${cta}\n\n#${nichoInput.replace(/\s+/g, '')} #${produtoInput.replace(/\s+/g, '')} #MarketingDigital #ConteúdoDeValor #Estratégia`
                });
            }

            let htmlConteudo = '';
            diasGerados.forEach(item => {
                htmlConteudo += `
                    <div class="bg-slate-900 border border-slate-700 rounded-xl p-4 space-y-2">
                        <div class="flex justify-between items-center">
                            <span class="bg-blue-600 text-white text-xs font-bold px-2.5 py-1 rounded-md">Dia ${item.dia}</span>
                            <span class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-md border border-slate-700 font-semibold">${item.formato}</span>
                        </div>
                        <p class="font-semibold text-sm text-slate-200">${item.titulo}</p>
                        <div class="bg-slate-800/60 p-3 rounded-lg text-xs text-slate-300 space-y-1">
                            <p><strong class="text-blue-300">Sugestão Visual:</strong> ${item.visual}</p>
                            <p><strong class="text-green-300">Roteiro / Gancho:</strong> ${item.roteiro}</p>
                        </div>
                        <div class="text-xs text-slate-400 bg-slate-950 p-3 rounded-lg whitespace-pre-wrap font-mono">
                            ${item.legenda}
                        </div>
                    </div>
                `;
            });

            lista.innerHTML = htmlConteudo;
        }
    </script>
</body>
</html>
